{
  "expo": {
    "name": "MBOLANI",
    "slug": "MBOLANI",
    "version": "1.0.0",
    "sdkVersion": "48.0.0",
    "platforms": ["android", "ios", "web"],
    "android": {
      "package": "com.farelbitome.mbolani",
      "versionCode": 1
  "build": {
    "production": {
      "android": {
        "buildType": "apk"
}name: EAS Android Build
on:
  workflow_dispatch:
  push:
    branches:
      - main
jobs:
  build:
    name: Build Android APK with EAS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Run EAS build (Android APK)
        env:
          EAS_TOKEN: ${{ secrets.EAS_TOKEN }}
        run: |
          eas build --platform android --profile production --non-interactive
